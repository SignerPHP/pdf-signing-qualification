name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, static analysis and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Map runner user into the container
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker compose build

      - name: Validate composer
        run: docker compose run --rm app composer validate --strict

      - name: Install dependencies
        run: docker compose run --rm app composer install --prefer-dist --no-interaction --no-progress

      - name: Pint check
        run: docker compose run --rm app composer pint:check

      - name: Psalm
        run: docker compose run --rm app composer psalm

      - name: Tests
        run: docker compose run --rm app composer tests
